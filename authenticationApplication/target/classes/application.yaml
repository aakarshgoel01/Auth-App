    name: authenticationApplication
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    username: dbAdmin
    password: system123#
  h2:
    console:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-client-secret}
